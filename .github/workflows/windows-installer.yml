name: Windows Installer

# Builds the CHAOS REALM plugin on Windows (MSVC), packages VST3 + Standalone
# into an Inno Setup installer, uploads it as a build artifact, and — on a
# version tag (v*) — publishes it to a GitHub Release.
#
# Trigger manually from the Actions tab (workflow_dispatch) or by pushing a tag:
#   git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: [ "v*" ]
    # Temporary: validate the MSVC build on this feature branch (no Release is
    # created — the publish step below is gated on tags). Remove once green.
    branches: [ "claude/chaos-realm-vst-plugin-lyr3vt" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write   # needed to attach the installer to a Release on tag builds

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $v = "${{ github.ref_name }}" -replace '^v',''
          } elseif ("${{ github.event.inputs.version }}") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "1.0.0"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building installer version $v"

      - name: Cache JUCE (FetchContent)
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: juce-${{ runner.os }}-

      - name: Configure (Release, plugin only)
        # Let CMake auto-detect the installed Visual Studio generator (the
        # runner image's VS version changes over time), forcing a 64-bit build.
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DCHAOS_BUILD_TESTS=OFF -DCHAOS_BUILD_PLUGIN=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifacts
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null

          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "CHAOS REALM.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VST3 bundle 'CHAOS REALM.vst3' not found under build/" }
          Copy-Item -Path $vst3.FullName -Destination "staging\CHAOS REALM.vst3" -Recurse -Force
          Write-Host "Staged VST3 from $($vst3.FullName)"

          $exe = Get-ChildItem -Path build -Recurse -File -Filter "CHAOS REALM.exe" |
                 Where-Object { $_.FullName -match 'Standalone' } | Select-Object -First 1
          if ($exe) {
            Copy-Item -Path $exe.FullName -Destination "staging\CHAOS REALM.exe" -Force
            "has_standalone=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Staged Standalone from $($exe.FullName)"
          } else {
            "has_standalone=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Standalone .exe not found — packaging VST3 only."
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $defs = @(
            "/DMyAppVersion=${{ steps.ver.outputs.version }}",
            "/DStagingDir=$PWD\staging"
          )
          if ("${{ steps.stage.outputs.has_standalone }}" -eq "true") { $defs += "/DHasStandalone=1" }

          & $iscc @defs "/O$PWD\dist" "packaging\windows\CHAOSRealm.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHAOS-REALM-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: CHAOS REALM ${{ steps.ver.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
